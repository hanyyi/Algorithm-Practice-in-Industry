name: daily_feishu_digest

on:
  workflow_dispatch:
  schedule:
    # 08:00 Pacific time, automatically following PST/PDT daylight saving changes.
    - cron: "0 8 * * *"
      timezone: "America/Los_Angeles"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  push-daily-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: "America/Los_Angeles"
      FEISHU_URL: ${{ secrets.FEISHU_URL }}
      INDUSTRY_LIMIT: "5"
      CONF_LIMIT: "3"
      ARXIV_LIMIT: "10"
      LOOKBACK_DAYS: "7"
      ARXIV_LOOKBACK_DAYS: "7"
      ARXIV_CATEGORIES: "cs.IR,cs.CL,cs.LG"
      CONF_START_YEAR: "2021"
      CONFS: "kdd,www,cikm,recsys,wsdm,sigir,ecir"

    steps:
      - name: Checkout repository and conference data
        uses: actions/checkout@v4
        with:
          lfs: true
          sparse-checkout: |
            paperBotV2
            requirements.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Feishu secret
        run: |
          if [ -z "$FEISHU_URL" ]; then
            echo "FEISHU_URL is not configured in repository Actions secrets"
            exit 1
          fi

      - name: Push fresh arXiv papers
        run: python -m paperBotV2.arxiv_daily.daily_push

      - name: Push industry-practice articles
        run: python -m paperBotV2.industry_practice.daily_push

      - name: Push top-conference papers
        run: python -m paperBotV2.conf_summary.daily_push
